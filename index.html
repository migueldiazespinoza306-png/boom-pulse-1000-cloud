
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOOM PULSE 1000 CLOUD</title>
<style>
body{background:#10151f;color:white;font-family:Arial;padding:18px}
h2{color:#42d392}
.panel{background:#202b3b;padding:16px;border-radius:12px;margin:12px 0}
button{padding:12px;background:#42d392;border:0;border-radius:8px;font-weight:bold}
pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b8d5ca}
</style>
</head>
<body>
<h2>BOOM PULSE 1000 CLOUD</h2>
<div class="panel">
<h3>CONEXIÓN DERIV</h3>
<p id="status">Conectando...</p>
<button onclick="connect()">RECONectar</button>
</div>
<div class="panel">
<h3>MERCADOS BOOM ENCONTRADOS</h3>
<pre id="markets">Buscando mercados...</pre>
</div>
<div class="panel">
<h3>DATOS DE CONEXIÓN</h3>
<pre id="debug">Esperando respuesta...</pre>
</div>
<script>
let ws;
function connect(){
 if(ws) ws.close();
 document.getElementById("status").textContent="Conectando...";
 document.getElementById("markets").textContent="Consultando mercados...";
 document.getElementById("debug").textContent="Esperando respuesta...";
 ws=new WebSocket("wss://api.derivws.com/trading/v1/options/ws/public");
 ws.onopen=()=>{
  document.getElementById("status").textContent="Conectado. Solicitando símbolos...";
  ws.send(JSON.stringify({active_symbols:"full",req_id:1}));
 };
 ws.onmessage=(event)=>{
  let d;
  try{d=JSON.parse(event.data)}catch(e){
   document.getElementById("debug").textContent=event.data;return;
  }
  document.getElementById("debug").textContent=
    "Respuesta recibida: "+(d.msg_type||"sin tipo")+
    (d.error?"\nError: "+d.error.message:"");
  if(d.error){
   document.getElementById("status").textContent="Error: "+d.error.message;
   return;
  }
  if(d.msg_type==="active_symbols"||d.active_symbols){
   let arr=d.active_symbols||d.data?.active_symbols||[];
   if(!Array.isArray(arr)){
    document.getElementById("markets").textContent=
      "Formato inesperado:\n"+JSON.stringify(arr,null,2);
    return;
   }
   let boom=arr.filter(x=>{
    let s=[x.display_name,x.underlying_symbol_name,x.name,
      x.symbol,x.underlying_symbol].join(" ").toLowerCase();
    return s.includes("boom");
   });
   document.getElementById("status").textContent=
      "Respuesta recibida: "+arr.length+" mercados.";
   document.getElementById("markets").textContent=boom.length?
     boom.map(x=>(x.display_name||x.underlying_symbol_name||x.name||"Sin nombre")+
     "\nCódigo: "+(x.symbol||x.underlying_symbol||"No indicado")).join("\n\n"):
     "Deriv respondió, pero no aparecen mercados con la palabra Boom.\n"+
     "Revisa los datos de conexión.";
  }
 };
 ws.onerror=()=>{
  document.getElementById("status").textContent="Error de conexión WebSocket.";
 };
 ws.onclose=()=>{
  document.getElementById("debug").textContent+="\nConexión cerrada.";
 };
}
connect();
</script>
</body>
</html>
